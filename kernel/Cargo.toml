[package]
name = "nsos-kernel"
description = "Microkernel de nsos: scheduling, memoria, IPC y capacidades"
version.workspace = true
edition.workspace = true
repository.workspace = true

[[bin]]
name = "nsos-kernel"
test = false
bench = false

[dependencies]
nsos-abi = { path = "../crates/abi" }
linked_list_allocator = { version = "0.10.6", default-features = false, features = ["use_spin"] }
nsos-kcore = { path = "../crates/kcore" }
# Identificadores de los contratos de canal, para etiquetar los canales que
# reparte el kernel al arrancar.
nsos-contract = { path = "../crates/contract" }

# HMAC para la semilla del nonce del enlace (ver `arch::aarch64::nonce_seed`).
[target.'cfg(target_arch = "aarch64")'.dependencies]
nsos-link = { path = "../crates/link" }
