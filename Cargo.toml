[workspace]
resolver = "2"
# Toda carpeta de `crates/` y de `cells/` es un miembro: una cell nueva no
# se anota en ningún lado (los scripts también leen `cells/*/`).
members = ["crates/*", "kernel", "cells/*"]
# El kernel solo compila para `x86_64-unknown-none`; `cargo test` en el host
# se limita a las crates portables.
default-members = ["crates/abi", "crates/kcore", "crates/link", "crates/store", "crates/contract"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/nativosistemas/nsos"
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
