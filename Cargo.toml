[workspace]
resolver = "2"
members = [
    "crates/abi",
    "crates/kcore",
    "kernel",
    "cells/rt",
    "cells/ping",
    "cells/pong",
    "cells/intruso",
    "cells/virtcon",
    "cells/hola",
    "cells/init",
    "cells/fragil",
    "cells/dormilona",
    "cells/contador-v1",
    "cells/contador-v2",
    "cells/cliente",
    "cells/contador-roto",
]
# El kernel solo compila para `x86_64-unknown-none`; `cargo test` en el host
# se limita a las crates portables.
default-members = ["crates/abi", "crates/kcore"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/nativosistemas/nsos"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
