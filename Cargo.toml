[workspace]
resolver = "2"
members = [
    "crates/abi",
    "crates/kcore",
    "crates/link",
    "crates/store",
    "crates/contract",
    "kernel",
    "cells/rt",
    "cells/ping",
    "cells/pong",
    "cells/intruso",
    "cells/virtcon",
    "cells/hola",
    "cells/init",
    "cells/fragil",
    "cells/dormilona",
    "cells/contador-v1",
    "cells/contador-v2",
    "cells/cliente",
    "cells/contador-roto",
    "cells/caos",
    "cells/espera",
    "cells/desmapeo",
    "cells/sellada",
    "cells/bench",
    "cells/enlace",
    "cells/origen",
    "cells/destino",
    "cells/virtnet",
    "cells/virtblk",
    "cells/almacen",
    "cells/escritor",
    "cells/curioso",
]
# El kernel solo compila para `x86_64-unknown-none`; `cargo test` en el host
# se limita a las crates portables.
default-members = ["crates/abi", "crates/kcore", "crates/link", "crates/store", "crates/contract"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/nativosistemas/nsos"
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
