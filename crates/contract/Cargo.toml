[package]
name = "nsos-contract"
description = "Contratos de canal tipados al estilo Singularity: protocolos como autómatas comprobados al compilar"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

# `cfg(kani)`: pruebas de Kani (ver verification/kani.md).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
nsos-abi = { path = "../abi" }

[dev-dependencies]
# Solo para comprobar que las etiquetas de los contratos del almacén son las
# de `nsos_store::proto`.
nsos-store = { path = "../store" }
