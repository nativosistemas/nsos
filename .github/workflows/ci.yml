name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain de Rust
        run: rustup show
      - name: Dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso ovmf
      - name: Lint
        run: make lint
      - name: Tests unitarios
        run: make test
      - name: Arranque en QEMU (BIOS)
        run: make smoke
      - name: Benchmarks
        if: always()
        run: |
          if [ -f build/bench.log ]; then
            tools/bench-summary.sh build/bench.log "Benchmarks (QEMU, BIOS)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Arranque en QEMU (UEFI)
        run: make smoke-uefi

  arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain de Rust
        run: rustup show
      - name: Dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-efi-aarch64 mtools dosfstools
      - name: Arranque en QEMU virt (aarch64, UEFI)
        run: make smoke-arm
      - name: Benchmarks
        if: always()
        run: |
          if [ -f build/aarch64-bench.log ]; then
            tools/bench-summary.sh build/aarch64-bench.log "Benchmarks (QEMU virt, aarch64)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Demostraciones
        working-directory: verification/lean
        run: |
          lake build
          if grep -rnw --include='*.lean' -e sorry -e admit Nsos TraceGen.lean; then
            echo "hay demostraciones incompletas" >&2
            exit 1
          fi
      - name: Trazas del modelo al día
        run: |
          cd verification/lean
          lake exe tracegen ../../crates/kcore/tests/data/cspace_model.trace \
            ../../crates/contract/tests/data/contract_model.trace
          git diff --exit-code -- ../../crates/kcore/tests/data/cspace_model.trace \
            ../../crates/contract/tests/data/contract_model.trace

  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Pruebas de Kani
        run: make kani
