name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain de Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso ovmf
      - name: Lint
        run: make lint
      - name: Tests unitarios
        run: make test
      # `caos` usa una semilla distinta en cada corrida y la imprime
      # ("caos: semilla N"); para repetirla: CAOS_SEED=N make smoke.
      - name: Arranque en QEMU (BIOS)
        env:
          CAOS_SEED: ${{ github.run_id }}
        run: |
          echo "semilla de caos: $CAOS_SEED"
          make smoke
      - name: Benchmarks
        if: always()
        run: |
          if [ -f build/bench.log ]; then
            tools/bench-summary.sh build/bench.log "Benchmarks (QEMU, BIOS)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Arranque en QEMU (UEFI)
        run: make smoke-uefi

  arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain de Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-efi-aarch64 mtools dosfstools
      - name: Arranque en QEMU virt (aarch64, UEFI)
        env:
          CAOS_SEED: ${{ github.run_id }}
        run: |
          echo "semilla de caos: $CAOS_SEED"
          make smoke-arm
      - name: Benchmarks
        if: always()
        run: |
          if [ -f build/aarch64-bench.log ]; then
            tools/bench-summary.sh build/aarch64-bench.log "Benchmarks (QEMU virt, aarch64)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Instala Lean con la versión de `lean-toolchain`, guarda `.lake` en la
      # caché y corre `lake build`.
      - name: Demostraciones
        uses: leanprover/lean-action@v1.7.1
        with:
          lake-package-directory: verification/lean
          build: true
          test: false
          lint: false
      - name: Sin demostraciones incompletas
        working-directory: verification/lean
        run: |
          if grep -rnw --include='*.lean' -e sorry -e admit Nsos TraceGen.lean; then
            echo "hay demostraciones incompletas" >&2
            exit 1
          fi
      - name: Trazas del modelo al día
        run: |
          cd verification/lean
          lake exe tracegen ../../crates/kcore/tests/data/cspace_model.trace \
            ../../crates/contract/tests/data/contract_model.trace
          git diff --exit-code -- ../../crates/kcore/tests/data/cspace_model.trace \
            ../../crates/contract/tests/data/contract_model.trace

  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2.9.3
      # Kani instalado (binarios, `~/.kani` y el nightly de rustup al que
      # apunta `~/.kani/kani-*/toolchain`) se guarda en la caché: así no se
      # compila en cada corrida. La clave lleva las versiones; al subir Kani
      # hay que cambiar las dos.
      - name: Caché de Kani
        id: kani-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.kani
            ~/.rustup/toolchains/nightly-2026-08-21-x86_64-unknown-linux-gnu
          key: kani-0.68.0-nightly-2026-08-21-${{ runner.os }}
      - name: Instalar Kani
        if: steps.kani-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Pruebas de Kani
        run: make kani
